<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Functional Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>My Simple Website</h1>
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="home" class="hero">
        <h2>Welcome!</h2>
        <p>
          This is a simple functional website using HTML, CSS, and JavaScript.
        </p>
        <button id="changeTextBtn">Click Me</button>
        <p id="message"></p>
      </section>

      <section id="about">
        <h2>About</h2>
        <p>
          This website demonstrates a clean layout with interactive
          functionality.
        </p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <form id="contactForm">
          <input type="text" id="name" placeholder="Your Name" required />
          <input type="email" id="email" placeholder="Your Email" required />
          <textarea
            id="messageBox"
            placeholder="Your Message"
            required
          ></textarea>
          <button type="submit">Send</button>
        </form>

        <p id="formResponse"></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 My Simple Website</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
